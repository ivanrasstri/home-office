<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Тоннель TEZKOR v2: физические материалы, свет из глубины, AO, фаски, дымка.
import * as THREE from 'three';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const G = await (await fetch('glyphs.json')).json();
const CAP = G.baseline - G.capTop;
const loader = new SVGLoader();

function flipPath(d) {
  const toks = d.match(/[MLCZ]|-?\d*\.?\d+(?:e-?\d+)?/g);
  const out = []; let isX = true;
  for (const t of toks) {
    if (/[MLCZ]/.test(t)) { out.push(t); isX = true; continue; }
    const v = parseFloat(t);
    out.push(isX ? v.toFixed(3) : (G.baseline - v).toFixed(3));
    isX = !isX;
  }
  return out.join(' ');
}
function glyphSpan(idx) {
  let min = Infinity, max = -Infinity;
  for (const i of idx) {
    const nums = G.paths[i].match(/-?\d*\.?\d+/g).map(Number);
    for (let k = 0; k < nums.length; k += 2) { min = Math.min(min, nums[k]); max = Math.max(max, nums[k]); }
  }
  return [min, max];
}
// буквы со скруглённой фаской; координаты в мировых единицах (scale применяется до экструзии)
function wordGeometry(scale, depth, bevel, glyphIdx) {
  const geoms = [];
  for (const i of glyphIdx ?? G.paths.map((_, k) => k)) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg"><path d="${flipPath(G.paths[i])}"/></svg>`;
    for (const p of loader.parse(svg).paths) {
      const shapes = SVGLoader.createShapes(p).map(s => {
        const pts = s.extractPoints(24);
        const sh = new THREE.Shape(pts.shape.map(v => v.clone().multiplyScalar(scale)));
        sh.holes = pts.holes.map(h => new THREE.Path(h.map(v => v.clone().multiplyScalar(scale))));
        return sh;
      });
      geoms.push(new THREE.ExtrudeGeometry(shapes, {
        depth: Math.max(depth - 2 * bevel, 0.001), bevelEnabled: bevel > 0, bevelThickness: bevel,
        bevelSize: bevel * 0.9, bevelOffset: -bevel * 0.9, bevelSegments: 5, curveSegments: 24,
      }));
    }
  }
  const g = mergeGeometries(geoms.map(x => x.toNonIndexed()), false);
  g.translate(0, 0, bevel);
  return g;
}

let renderer, composer, scene, camera, gtao;
function setCam(cfg, width, height) {
  camera = camera ?? new THREE.PerspectiveCamera(60, width / height, 0.05, 2000);
  camera.fov = cfg.fov ?? 60;
  camera.aspect = width / height;
  camera.up.set(0, 1, 0);
  camera.position.set(...(cfg.cam ?? [0, 0, 0]));
  camera.lookAt(new THREE.Vector3(...(cfg.look ?? [0, 0, -100])));
  if (cfg.roll) camera.rotateZ(cfg.roll);
  camera.updateProjectionMatrix();
}

window.renderFrame = async (cfg) => {
  const W = cfg.W ?? 16, H = cfg.H ?? 9, L = cfg.L ?? 182;
  const width = cfg.width ?? 1920, height = cfg.height ?? 1080, pr = cfg.pixelRatio ?? 2;
  const mime = cfg.mime ?? 'image/png';
  if (cfg.cameraOnly && scene) {
    setCam(cfg, width, height);
    composer.render();
    return renderer.domElement.toDataURL(mime, 0.93);
  }
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    document.body.appendChild(renderer.domElement);
  }
  renderer.setPixelRatio(pr);
  renderer.setSize(width, height);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = cfg.exposure ?? 1.0;

  scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = cfg.envI ?? 0.55;
  scene.background = new THREE.Color(cfg.wall);
  scene.fog = new THREE.FogExp2(new THREE.Color(cfg.haze ?? '#9D7BFF'), cfg.hazeDensity ?? 0.0075);
  setCam(cfg, width, height);

  const endZ = -L * 0.95;
  // свет из глубины тоннеля + мягкая заливка со стороны камеры
  const endLight = new THREE.PointLight(new THREE.Color(cfg.endLight ?? '#C9B2FF'), cfg.endI ?? 900, 0, 1.15);
  endLight.position.set(0, 0, endZ + 4); scene.add(endLight);
  const midLight = new THREE.PointLight(new THREE.Color(cfg.midLight ?? '#E9F6FF'), cfg.midI ?? 60, 0, 1.4);
  midLight.position.set(0, 0, (cfg.cam?.[2] ?? 0) - 18); scene.add(midLight);
  const fill = new THREE.DirectionalLight(0xffffff, cfg.fillI ?? 0.9);
  fill.position.set(0.25, 0.35, 1); scene.add(fill);

  // оболочка тоннеля
  const shellMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(cfg.wall), roughness: 0.92, metalness: 0, side: THREE.BackSide });
  const shell = new THREE.Mesh(new THREE.BoxGeometry(W, H, L * 2), shellMat);
  shell.position.z = -L + 5; scene.add(shell);
  // светящийся торец
  const endMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(cfg.glow ?? '#7A2BFF').multiplyScalar(cfg.glowHDR ?? 1.6), fog: false, toneMapped: false });
  const end = new THREE.Mesh(new THREE.PlaneGeometry(W, H), endMat);
  end.position.z = endZ; scene.add(end);

  const white = new THREE.MeshStandardMaterial({
    color: new THREE.Color(cfg.whiteColor ?? '#F3F4F9'), roughness: 0.5, metalness: 0,
    emissive: new THREE.Color('#FFFFFF'), emissiveIntensity: cfg.whiteEmissive ?? 0.22,
  });
  const cyan = new THREE.MeshStandardMaterial({
    color: new THREE.Color('#00C2FF'), roughness: 0.38, metalness: 0,
    emissive: new THREE.Color('#00C2FF'), emissiveIntensity: cfg.cyanEmissive ?? 0.42,
  });

  // стены: слово стоит на стене и читается вдоль тоннеля
  const wallCap = H * (cfg.wallFill ?? 0.86);
  const ws = wallCap / CAP;
  const wallDepth = cfg.wallDepth ?? 0.5;
  const wallGeo = wordGeometry(ws, wallDepth, cfg.wallBevel ?? 0.09);
  const wordLen = G.width * ws, gap = cfg.wallGap ?? wallCap * 0.34;
  const nWall = Math.ceil(L / (wordLen + gap)) + 1;
  const wallMesh = (side) => {
    const m = new THREE.InstancedMesh(wallGeo, white, nWall);
    const o = new THREE.Object3D();
    for (let i = 0; i < nWall; i++) {
      const z0 = (cfg.wallStart ?? -1.2) - i * (wordLen + gap);
      if (side < 0) { o.position.set(-W / 2, -wallCap / 2, z0); o.rotation.set(0, Math.PI / 2, 0); }
      else { o.position.set(W / 2, -wallCap / 2, z0 - wordLen); o.rotation.set(0, -Math.PI / 2, 0); }
      o.updateMatrix(); m.setMatrixAt(i, o.matrix);
    }
    return m;
  };
  scene.add(wallMesh(-1), wallMesh(1));

  // пол и потолок: ряды «TEZ», читаются от камеры
  const rowGlyphs = cfg.rowGlyphs ?? [0, 1, 2];
  const [gx0, gx1] = glyphSpan(rowGlyphs);
  const rowWidth = (W - 2 * wallDepth) * (cfg.rowFill ?? 0.95);
  const fs = rowWidth / (gx1 - gx0);
  const rowCap = CAP * fs;
  const rowGeo = wordGeometry(fs, cfg.rowDepth ?? 0.2, cfg.rowBevel ?? 0.05, rowGlyphs);
  rowGeo.translate(-gx0 * fs, 0, 0);
  const rowStep = rowCap * (cfg.rowStepK ?? 1.34);
  const nRows = Math.ceil(L / rowStep);
  const rows = (floor) => {
    const m = new THREE.InstancedMesh(rowGeo, cyan, nRows);
    const o = new THREE.Object3D();
    for (let i = 0; i < nRows; i++) {
      const z = (cfg.rowStart ?? 0) - i * rowStep;
      if (floor) { o.position.set(-rowWidth / 2, -H / 2, z); o.rotation.set(-Math.PI / 2, 0, 0); }
      else { o.position.set(-rowWidth / 2, H / 2, z - rowCap); o.rotation.set(Math.PI / 2, 0, 0); }
      o.updateMatrix(); m.setMatrixAt(i, o.matrix);
    }
    return m;
  };
  scene.add(rows(true), rows(false));

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  if (cfg.ao !== 0) {
    gtao = new GTAOPass(scene, camera, width * pr, height * pr);
    gtao.output = GTAOPass.OUTPUT.Default;
    gtao.blendIntensity = cfg.ao ?? 1.0;
    gtao.updateGtaoMaterial({ radius: cfg.aoRadius ?? 0.9, distanceExponent: 1.4, thickness: 1.2, scale: 1.0, samples: 16 });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
    composer.addPass(gtao);
  }
  if (cfg.bloom) composer.addPass(new UnrealBloomPass(new THREE.Vector2(width * pr, height * pr), cfg.bloom, cfg.bloomRadius ?? 0.55, cfg.bloomThreshold ?? 0.88));
  composer.addPass(new OutputPass());
  composer.render();
  return renderer.domElement.toDataURL(mime, 0.93);
};
window.ready = true;
</script>
</body></html>

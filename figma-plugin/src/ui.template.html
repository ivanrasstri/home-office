<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        margin: 0;
        padding: 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 12px;
        margin: 0 0 4px;
      }
      p {
        color: #666;
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }
      input[type="number"] {
        width: 60px;
        padding: 4px 6px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 8px 12px;
        background: #18a0fb;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #2c2c2c;
      }
      button:disabled {
        background: #b3d9f7;
        cursor: default;
      }
      #status,
      #publish-status {
        margin-top: 12px;
        min-height: 16px;
        color: #333;
        word-break: break-word;
      }
      #publish-status a {
        color: #18a0fb;
        display: block;
        margin-top: 4px;
      }
      hr {
        border: none;
        border-top: 1px solid #eee;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>Экспорт в PDF + PPTX</h1>
    <p>
      Выдели фреймы-слайды (или ничего не выделяй — тогда возьмутся все фреймы
      текущей страницы) и нажми «Экспортировать».
    </p>
    <label for="scale">Масштаб рендера</label>
    <input id="scale" type="number" min="1" max="4" step="0.5" value="2" />
    <button id="export">Экспортировать</button>
    <div id="status"></div>

    <hr />

    <h2>Опубликовать в вебе</h2>
    <p>
      Отдаёт shareable-ссылку и аналитику просмотров через свой сервер
      (<code>pitchdeck_server</code>).
    </p>
    <label for="server-url">Адрес сервера</label>
    <input id="server-url" type="text" placeholder="https://your-app.up.railway.app" />
    <label for="api-token">API-токен</label>
    <input id="api-token" type="password" placeholder="PITCHDECK_API_TOKEN" />
    <button id="publish" class="secondary">Опубликовать</button>
    <div id="publish-status"></div>
    <!-- BUNDLE -->
  </body>
</html>
